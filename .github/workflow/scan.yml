name: QA Job Radar Scan

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay this slightly during
    # high load - that's normal and out of our control.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a scan manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated seen_jobs.json

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run job scanner
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python job_scanner.py

      - name: Save seen-jobs state
        run: |
          git config user.name "qa-job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen jobs [skip ci]"
          git push
